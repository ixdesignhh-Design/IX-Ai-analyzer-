<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OmniLab Pro Station // Multi-Engine & XiaoZhi Hub</title>
  
  <style>
    :root {
      --bg: #030712;
      --card: #0b1222;
      --border: rgba(255, 255, 255, 0.08);
      --accent: #00f0ff;
      --seismo: #ff2d55;
      --compass: #a855f7;
      --pulse: #ec4899;
      --gold: #fbbf24;
      --success: #10b981;
      --danger: #ef4444;
      --xiaozhi: #3b82f6;
      --text: #f8fafc;
      --sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding: 12px; padding-bottom: 90px; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 1.1rem; font-weight: 800; color: var(--accent); letter-spacing: 0.5px; }
    .status-badge { font-size: 0.75rem; background: rgba(0,240,255,0.1); color: var(--accent); padding: 4px 8px; border-radius: 999px; border: 1px solid rgba(0,240,255,0.3); }

    .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      position: relative;
      overflow: hidden;
    }
    .card-title { font-size: 0.85rem; font-weight: 700; color: var(--sub); text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }

    /* Barometr */
    .baro-val { font-size: 2.2rem; font-weight: 800; color: var(--gold); }
    .baro-sub { display: flex; justify-content: space-between; margin-top: 8px; font-size: 0.8rem; color: var(--sub); }
    .trend-indicator { font-weight: bold; color: var(--success); }

    /* XiaoZhi & Awatar */
    .avatar-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 0; }
    .avatar {
      width: 90px; height: 90px; border-radius: 50%; background: radial-gradient(circle, #3b82f6 0%, #1e1b4b 100%);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); display: flex; align-items: center; justify-content: center;
      position: relative; transition: all 0.3s ease;
    }
    .avatar.talking { transform: scale(1.08); box-shadow: 0 0 35px rgba(0, 240, 255, 0.8); }
    .avatar.listening { box-shadow: 0 0 35px rgba(236, 72, 153, 0.8); }
    
    .eye-container { display: flex; gap: 18px; }
    .eye { width: 14px; height: 18px; background: #fff; border-radius: 50%; position: relative; transition: 0.2s; }
    .avatar.blink .eye { height: 2px; }
    .avatar.happy .eye { border-radius: 14px 14px 0 0; height: 10px; }

    .chat-output { font-size: 0.85rem; color: var(--text); background: rgba(0,0,0,0.3); border-radius: 8px; padding: 8px 12px; margin-top: 10px; min-height: 48px; border-left: 3px solid var(--xiaozhi); }

    .btn-group { display: flex; gap: 8px; margin-top: 10px; }
    button {
      flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.8rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s;
    }
    .btn-primary { background: var(--xiaozhi); color: white; }
    .btn-accent { background: var(--accent); color: #000; }
    .btn-danger { background: var(--danger); color: white; }
    button:active { transform: scale(0.97); }

    /* Kamera & Wirtualny Szkielet */
    .cam-container { position: relative; width: 100%; aspect-ratio: 4/3; border-radius: 10px; overflow: hidden; background: #000; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    canvas { pointer-events: none; z-index: 2; }
  </style>
</head>
<body>

  <header>
    <div class="logo">OMNILAB PRO // OS</div>
    <div class="status-badge" id="sensor-status">BARO ONLINE</div>
  </header>

  <div class="grid">
    <!-- PANEL BAROMETRU -->
    <div class="card">
      <div class="card-title">
        <span>Barometr & Altimetr</span>
        <span style="color:var(--gold)">BOSH/ST SENSOR</span>
      </div>
      <div class="baro-val"><span id="pressure-val">1013.25</span> <small style="font-size:1rem;color:var(--sub);">hPa</small></div>
      <div class="baro-sub">
        <div>Wysokość: <b id="altitude-val" style="color:var(--text);">0.0</b> m n.p.m.</div>
        <div>Tendencja: <span class="trend-indicator" id="weather-trend">Stabilnie</span></div>
      </div>
      <div class="baro-sub" style="margin-top:4px;">
        <div>Ciśnienie: <b id="pressure-mmhg">760</b> mmHg</div>
        <div style="cursor:pointer; text-decoration:underline;" onclick="calibrateQNH()">Kalibruj QNH</div>
      </div>
    </div>

    <!-- PANEL XIAOZHI AI CHATBOT & AWATAR -->
    <div class="card">
      <div class="card-title">
        <span>XiaoZhi AI Companion</span>
        <span id="ai-status" style="color:var(--xiaozhi)">GOTOWY</span>
      </div>
      <div class="avatar-box">
        <div class="avatar" id="avatar">
          <div class="eye-container">
            <div class="eye"></div>
            <div class="eye"></div>
          </div>
        </div>
      </div>
      <div class="chat-output" id="chat-bubble">Jestem XiaoZhi. W czym mogę Ci dzisiaj pomóc?</div>
      <div class="btn-group">
        <button class="btn-primary" id="btn-voice">Mów do AI</button>
        <button class="btn-accent" onclick="testEmotion('happy')">Radość</button>
        <button class="btn-accent" onclick="testEmotion('alert')">Alert</button>
      </div>
    </div>

    <!-- PANEL WIZYJNY ZE SZKIELETEM -->
    <div class="card" style="grid-column: 1 / -1;">
      <div class="card-title">
        <span>Analiza Wizyjna // Wirtualny Szkielet</span>
        <button style="flex:unset; padding:4px 8px; font-size:0.7rem;" class="btn-accent" id="btn-cam" onclick="toggleCamera()">Włącz Kamerę</button>
      </div>
      <div class="cam-container">
        <video id="webcam" playsinline muted autoplay></video>
        <canvas id="overlay-canvas"></canvas>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================================
       1. ZAAWANSOWANY BAROMETR & ALTIMETR
       ========================================================================= */
    let qnh = 1013.25; // standardowe ciśnienie na poziomie morza
    let pressureHistory = [];

    function updateBarometer(hPa) {
      document.getElementById('pressure-val').innerText = hPa.toFixed(2);
      document.getElementById('pressure-mmhg').innerText = (hPa * 0.750062).toFixed(1);

      // Wzór hipsometryczny na wysokość: h = 44330 * (1 - (p / p0)^(1/5.255))
      const alt = 44330 * (1 - Math.pow((hPa / qnh), 0.19029495));
      document.getElementById('altitude-val').innerText = alt.toFixed(1);

      // Analiza tendencji
      pressureHistory.push({ t: Date.now(), p: hPa });
      if (pressureHistory.length > 20) pressureHistory.shift();
      evaluateTrend();
    }

    function evaluateTrend() {
      if (pressureHistory.length < 2) return;
      const diff = pressureHistory[pressureHistory.length - 1].p - pressureHistory[0].p;
      const trendEl = document.getElementById('weather-trend');
      if (diff > 0.5) {
        trendEl.innerText = "Wzrost (Poprawa pogody)";
        trendEl.style.color = "var(--success)";
      } else if (diff < -0.5) {
        trendEl.innerText = "Spadek (Pogorszenie / Wiatr)";
        trendEl.style.color = "var(--danger)";
      } else {
        trendEl.innerText = "Stabilnie";
        trendEl.style.color = "var(--sub)";
      }
    }

    function calibrateQNH() {
      const input = prompt("Wprowadź aktualne lokalne ciśnienie QNH na poziomie morza (hPa):", qnh);
      if (input && !isNaN(input)) {
        qnh = parseFloat(input);
        alert("Skalibrowano do QNH: " + qnh + " hPa");
      }
    }

    // Obsługa natywnego czujnika ciśnienia Android Sensor API (PressureSensor)
    if ('PressureSensor' in window) {
      try {
        const sensor = new PressureSensor({ frequency: 2 });
        sensor.addEventListener('reading', () => updateBarometer(sensor.pressure));
        sensor.start();
      } catch (err) {
        console.warn("Sensor błąd:", err);
      }
    } else {
      // Symulacja zmian ciśnienia, jeśli urządzenie testowane jest w desktopie/przeglądarce bez bezpośredniego dostępu
      let mockP = 1012.4;
      setInterval(() => {
        mockP += (Math.random() - 0.5) * 0.05;
        updateBarometer(mockP);
      }, 2000);
    }

    /* =========================================================================
       2. AWATAR XIAOZHI & INTERAKCJA GŁOSOWA
       ========================================================================= */
    const avatar = document.getElementById('avatar');
    const chatBubble = document.getElementById('chat-bubble');
    const aiStatus = document.getElementById('ai-status');

    // Mruganie awatara
    setInterval(() => {
      avatar.classList.add('blink');
      setTimeout(() => avatar.classList.remove('blink'), 180);
    }, 4000);

    function testEmotion(type) {
      avatar.className = 'avatar ' + type;
      setTimeout(() => avatar.className = 'avatar', 2500);
    }

    // Synteza mowy (TTS)
    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'pl-PL';
      utterance.onstart = () => avatar.classList.add('talking');
      utterance.onend = () => avatar.classList.remove('talking');
      window.speechSynthesis.speak(utterance);
    }

    // Rozpoznawanie mowy (STT)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'pl-PL';
      recognition.onstart = () => {
        avatar.classList.add('listening');
        aiStatus.innerText = "SŁUCHAM...";
      };
      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        chatBubble.innerText = "Ty: " + transcript;
        avatar.classList.remove('listening');
        aiStatus.innerText = "PRZETWARZAM...";
        handleAIQuery(transcript);
      };
      recognition.onerror = () => {
        avatar.classList.remove('listening');
        aiStatus.innerText = "BŁĄD";
      };
    }

    document.getElementById('btn-voice').onclick = () => {
      if (recognition) recognition.start();
      else alert("Rozpoznawanie mowy nie jest obsługiwane w tym widoku.");
    };

    function handleAIQuery(query) {
      // Mock logiki XiaoZhi (można podpiąć WebSocket do XiaoZhi hub lub REST LLM)
      setTimeout(() => {
        let answer = "Zarejestrowałem zapytanie. Wszystkie systemy stacji działają nominalnie.";
        if (query.toLowerCase().includes("ciśnienie") || query.toLowerCase().includes("wysokość")) {
          answer = `Aktualne ciśnienie wynosi ${document.getElementById('pressure-val').innerText} hektopaskali.`;
        }
        chatBubble.innerText = "XiaoZhi: " + answer;
        aiStatus.innerText = "ONLINE";
        speak(answer);
      }, 700);
    }

    /* =========================================================================
       3. KAMERA & WIRTUALNY SZKIELET (COMPUTER VISION)
       ========================================================================= */
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d');
    let camRunning = false;

    async function toggleCamera() {
      if (camRunning) {
        const stream = video.srcObject;
        if (stream) stream.getTracks().forEach(t => t.stop());
        video.srcObject = null;
        camRunning = false;
        document.getElementById('btn-cam').innerText = "Włącz Kamerę";
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });
        video.srcObject = stream;
        camRunning = true;
        document.getElementById('btn-cam').innerText = "Zatrzymaj";
        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          renderSkeletonFrame();
        };
      } catch (err) {
        alert("Brak dostępu do kamery: " + err.message);
      }
    }

    // Symulacja / generator punktów szkieletu sylwetki (do spięcia z modelem PoseNet / MediaPipe)
    function renderSkeletonFrame() {
      if (!camRunning) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Przykładowy układ stawów i kości (HUD Overlay)
      const w = canvas.width, h = canvas.height;
      const joints = [
        { x: w * 0.5, y: h * 0.28 }, // głowa
        { x: w * 0.5, y: h * 0.40 }, // szyja
        { x: w * 0.38, y: h * 0.42 }, // l. ramię
        { x: w * 0.62, y: h * 0.42 }, // p. ramię
        { x: w * 0.34, y: h * 0.58 }, // l. łokieć
        { x: w * 0.66, y: h * 0.58 }, // p. łokieć
        { x: w * 0.5, y: h * 0.68 }  // tułów
      ];

      // Rysowanie połączeń (kości)
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(joints[0].x, joints[0].y); ctx.lineTo(joints[1].x, joints[1].y);
      ctx.moveTo(joints[1].x, joints[1].y); ctx.lineTo(joints[2].x, joints[2].y);
      ctx.moveTo(joints[1].x, joints[1].y); ctx.lineTo(joints[3].x, joints[3].y);
      ctx.moveTo(joints[2].x, joints[2].y); ctx.lineTo(joints[4].x, joints[4].y);
      ctx.moveTo(joints[3].x, joints[3].y); ctx.lineTo(joints[5].x, joints[5].y);
      ctx.moveTo(joints[1].x, joints[1].y); ctx.lineTo(joints[6].x, joints[6].y);
      ctx.stroke();

      // Rysowanie stawów
      joints.forEach((j) => {
        ctx.fillStyle = '#ff2d55';
        ctx.beginPath();
        ctx.arc(j.x, j.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      });

      requestAnimationFrame(renderSkeletonFrame);
    }
  </script>
</body>
</html>
